<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - BloodConnect</title>
    <!-- Font Awesome for Professional Monochromatic Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand">
                <i class="fa-solid fa-droplet brand-icon"></i>
                Blood<span>Connect</span>
            </a>
            <div>
                <a href="register.html" class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px;">
                    <i class="fa-solid fa-user-plus"></i> Register
                </a>
            </div>
        </div>
    </header>

    <!-- Sign In Section -->
    <main class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <div class="auth-icon-circle">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to your BloodConnect account with your email.</p>
            </div>

            <!-- Alert Container -->
            <div id="alertBox" class="alert"></div>

            <form id="loginForm">
                
                <!-- Email Address -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btnSubmit" class="btn btn-primary btn-block" style="padding: 13px; margin-top: 10px;">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In with Email
                </button>

            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-secondary);">
                Don't have an account yet? <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register Now</a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            BloodConnect &copy; 2026 | Saving Lives Together
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
